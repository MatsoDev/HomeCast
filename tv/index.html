<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,height=device-height,initial-scale=1"><title>HomeCast</title><link rel="stylesheet" href="style.css"></head><body>
<video id="player" tabindex="0" playsinline></video>
<div id="idle"><div class="logo">HOMECAST</div><div>Waiting for cast…</div><div id="connection">Configure server in Settings (press OK)</div><button id="settingsButton">Settings</button></div>
<div id="overlay"><div id="title"></div><div id="volume"></div><div id="progress"><div id="bar"></div></div><div id="time"></div></div>
<div id="settings" class="hidden"><div class="panel"><h1>HomeCast settings</h1><label>Server IP or hostname<input id="host" type="text" placeholder="192.168.1.10"></label><label>Port<input id="port" type="text" value="3000"></label><label>Pairing token<input id="token" type="password"></label><button id="save">Save and connect</button><button id="cancel">Cancel</button></div></div>
<script src="app.js"></script></body></html>
